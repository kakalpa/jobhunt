<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS squircle base background -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)" />
  <rect width="176" height="176" x="2" y="2" rx="39" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- Radar grid rings -->
  <circle cx="90" cy="90" r="64" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="90" cy="90" r="46" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" />
  <circle cx="90" cy="90" r="28" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />

  <!-- Crosshairs -->
  <line x1="90" y1="20" x2="90" y2="160" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" />
  <line x1="20" y1="90" x2="160" y2="90" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" />

  <!-- Sweeping radar cone -->
  <path d="M 90 90 L 135 45 A 64 64 0 0 0 90 26 Z" fill="url(#brandGrad)" opacity="0.22" />

  <!-- Central cockpit emblem / layers icon -->
  <!-- Bottom layer -->
  <path d="M 90 62 L 132 82 L 90 102 L 48 82 Z" fill="url(#brandGrad)" filter="url(#glow)" />
  <path d="M 48 94 L 90 114 L 132 94" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 48 106 L 90 126 L 132 106" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center blip / active target dot -->
  <circle cx="120" cy="60" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="120" cy="60" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />
</svg>
